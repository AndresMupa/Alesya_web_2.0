# Avisos de actualización automáticos: dependencias de la aplicación y acciones de los flujos de trabajo.
# Cada propuesta pasa por el mismo CI (lint, pruebas del despliegue y build) antes de poder fusionarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: /platform
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      parches-y-menores:
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
