# Despliegue a cPanel en cada push a la rama de producción (o a mano desde Actions).
#
# Todo va por HTTPS con la API de cPanel (sin SFTP ni SSH): el hosting llegó a cortar las conexiones SFTP
# desde GitHub. El detalle está en .github/scripts/cpanel-deploy.mjs y sus pruebas en cpanel-deploy.test.mjs.
#   1. Reutiliza ci.yml (lint, pruebas del despliegue y build).
#   2. npm run package:cpanel: paquete linux x64 validado y con smoke test (Docker del runner).
#   3. Autoprueba en el servidor: sube, renombra, lee y borra una carpeta temporal sin tocar la app.
#   4. Sube el .tar.gz a <APP_DIR>.release-<commit>, cPanel lo extrae y se verifica su BUILD_ID.
#   5. Intercambia carpetas con dos renombrados (la versión anterior queda en <APP_DIR>.previous); si el
#      segundo falla, restaura la anterior.
#   6. Sube tmp/restart.txt para que la app reinicie; bootstrap.mjs aplica las migraciones al arrancar.
#   7. Comprueba que el sitio sirva archivos del build nuevo; si no, vuelve solo a la versión anterior.
#
# Volver atrás a mano (Administrador de archivos): renombrar <APP_DIR> a otro nombre,
# <APP_DIR>.previous a <APP_DIR>, y reiniciar la app en "Setup Node.js App".
#
# Secrets del entorno "production":
#   CPANEL_API_TOKEN (cPanel → Seguridad → Manage API Tokens),
#   CPANEL_USER o, si no existe, CPANEL_SSH_USER (el usuario de la cuenta de cPanel),
#   CPANEL_APP_DIR (ruta absoluta de la raíz de la app, p. ej. /home/usuario/alesya-platform).
#   Los secrets CPANEL_SSH_* restantes ya no se usan.
# Variables: CPANEL_API_URL (p. ej. https://alesyaediciones.com:2083), PRODUCTION_URL (para el chequeo de salud).
name: Deploy cPanel

on:
  push:
    branches: [main-rzbi9x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Empaquetar y desplegar
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"

      - name: Empaquetar para cPanel
        working-directory: platform
        run: npm run package:cpanel

      - name: Extraer paquete
        id: pkg
        run: |
          archive=$(ls outputs/alesya-cpanel-linux-x64-*.tar.gz | head -n 1)
          mkdir -p pkg
          tar -xzf "$archive" -C pkg
          build_id=$(cat pkg/.next/BUILD_ID)
          # Preferir un archivo de .next/static/<BUILD_ID>/: solo existe en este build.
          probe=$(cd pkg && { find ".next/static/$build_id" -type f 2>/dev/null; find .next/static -type f -name '*.js'; } | head -n 1)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "probe=${probe#.next/}" >> "$GITHUB_OUTPUT"
          echo "Build $build_id, $(find pkg -type f | wc -l) archivos, $(du -h "$archive" | cut -f1)"

      - name: Subir y activar
        id: deploy
        # El token solo se entrega a los pasos que hablan con cPanel.
        env:
          API_URL: ${{ vars.CPANEL_API_URL }}
          API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_USER: ${{ secrets.CPANEL_USER || secrets.CPANEL_SSH_USER }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
          COMMIT: ${{ github.sha }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
          PKG_DIR: pkg
        run: node .github/scripts/cpanel-deploy.mjs deploy

      - name: Chequeo de salud
        if: vars.PRODUCTION_URL != ''
        env:
          URL: ${{ vars.PRODUCTION_URL }}
          PROBE: ${{ steps.pkg.outputs.probe }}
        run: |
          # Un archivo estático del build nuevo solo responde 200 cuando la app nueva ya arrancó;
          # la ficha del destacado confirma que la base y la migración 0004 responden.
          curl -fsS -o /dev/null "$URL/" || true
          for i in $(seq 1 36); do
            if curl -fsS -o /dev/null "$URL/_next/$PROBE" && curl -fsS -o /dev/null "$URL/catalogo/kit-arduino-explorador"; then
              echo "OK: $URL sirve el build nuevo"; exit 0
            fi
            sleep 5
          done
          echo "El sitio no sirve el build nuevo tras 3 minutos." >&2
          exit 1

      - name: Volver a la versión anterior
        # Solo si la versión nueva llegó a activarse y algo falló después (chequeo de salud o reinicio).
        if: failure() && steps.deploy.outputs.swapped == 'true'
        env:
          API_URL: ${{ vars.CPANEL_API_URL }}
          API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_USER: ${{ secrets.CPANEL_USER || secrets.CPANEL_SSH_USER }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
          COMMIT: ${{ github.sha }}
        run: node .github/scripts/cpanel-deploy.mjs rollback
